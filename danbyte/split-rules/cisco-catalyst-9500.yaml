# split-pack rules for the 3D workflow's working folder `cisco-catalyst-9500`:
# which library packs its entries go into, and the meta and reasons its
# YAML does not carry itself.
#   danbyte-lib split-pack <folder> --rules danbyte/split-rules/cisco-catalyst-9500.yaml --force
packs:
  cisco-catalyst-9200:
    name: Cisco Catalyst 9200
    description: Catalyst 9200 and 9200L switches with their network modules, stack kit, power supplies, fan and stack cable.
    requires: [generic-connectors]
  cisco-catalyst-9300:
    name: Cisco Catalyst 9300
    description: Catalyst 9300 and 9300L switches with their network modules, power supplies, fan, and StackWise and StackPower cables.
    requires: [generic-connectors]
  cisco-catalyst-9500:
    name: Cisco Catalyst 9500
    description: Catalyst 9500 switches with their network modules, power supplies and fans.
    requires: [generic-connectors]
  cisco-optics:
    name: Cisco optics
    description: Cisco SFP, SFP+, SFP28 and QSFP transceivers and DAC cables.
    requires: [generic-connectors]
  generic-racks:
    name: Generic racks
    description: Rack kits and rack types (cabinets, open frames, wall cabinet), blanking panels, cable managers, shelves and 0U PDUs.
    requires: [generic-connectors]
  cisco-8200:
    name: Cisco Catalyst 8200
    description: Catalyst 8200 and 8200 uCPE edge routers.
    requires: [generic-connectors]
  cisco-catalyst-9800:
    name: Cisco Catalyst 9800
    description: Catalyst 9800 wireless controllers.
    requires: [generic-connectors]
  cisco-firepower-1000:
    name: Cisco Firepower 1000
    description: Firepower 1000 series firewalls.
    requires: [generic-connectors]
  cisco-catalyst-8300:
    name: Cisco Catalyst 8300
    description: Catalyst 8300 edge routers.
    requires: [generic-connectors]
  cisco-catalyst-3650:
    name: Cisco Catalyst 3650
    description: Catalyst 3650 switches with their power supplies, fan and stack kit.
    requires: [generic-connectors]
  fortinet-fortigate:
    name: Fortinet FortiGate
    description: FortiGate firewalls.
    requires: [generic-connectors]
  sonicwall-nsa:
    name: SonicWall NSA
    description: SonicWall NSA firewalls.
    requires: [generic-connectors]
  netgear-switches:
    name: Netgear switches
    description: Netgear smart managed switches.
    requires: [generic-connectors]
  hpe-aruba-5400:
    name: HPE Aruba 5400R zl2
    description: Aruba 5400R zl2 chassis switches with their line cards and fan tray.
    requires: [generic-connectors]
  generic-panels:
    name: Generic panels
    description: RJ45 patch panels and LC, SC and ST fibre panels.
    requires: [generic-connectors]
  generic-connectors:
    name: Generic connectors
    description: The plugs drawn at cabled ports - RJ45, LC, MPO, IEC power - and generic SFP and QSFP bodies.

rules:
  - match: "device/Cisco/C9200*"
    meta: {category: switch, family: Catalyst 9200}
  - match: "device/Cisco/C9300*"
    meta: {category: switch, family: Catalyst 9300}
  - match: "device/Cisco/C9500*"
    meta: {category: switch, family: Catalyst 9500}
  - match: "device/Generic/PDU-*"
    meta: {category: pdu}
  - match: "device/Cisco/*"
    why:
      "power-ports/StackPower1/*": "StackPower receptacles on the rear panel, A top and B bottom (Cisco C9300 HIG; pack report v1.6.15); NetBox has no StackPower port type, so Danbyte adds them as cisco-stackpower power ports"
      "interfaces/StackPort*": "typed by stack system so Danbyte picks the right stack cable head (export spec v1.12 section 8); upstream has the generic cisco-stackwise"
  - match: "device/Cisco/C9200L-24P-4X"
    why:
      "module-bays/FAN *": "the C9200L's fans are fixed, not field-replaceable units (Cisco C9200L hardware installation guide; pack report v1.6.29); upstream lists two fan bays"
  - match: "module/Cisco/C9200*"
    meta: {family: Catalyst 9200}
  - match: "module/Cisco/PWR-C[56]-*"
    meta: {family: Catalyst 9200}
  - match: "module/Cisco/C9300*"
    meta: {family: Catalyst 9300}
  - match: "module/Cisco/PWR-C1-*"
    meta: {family: Catalyst 9300}
  - match: "module/Cisco/C9500-*"
    meta: {family: Catalyst 9500}
  - match: "module/Cisco/C9K-*"
    meta: {family: Catalyst 9500}
  - match: "module/Cisco/PWR-C4-*"
    meta: {family: Catalyst 9500}
  - match: "module/Cisco/FAN-T4-R"
    meta: {family: Catalyst 9500}
  - match: "module/Cisco/PWR-C1-350WAC-P"
    why:
      "power-ports/PSU{module}": "the inlet is C16: the module shares the 715 W unit's inlet, which has the C16 key (pack report v1.6.8); upstream lists iec-60320-c14"
  - match: "module/Cisco/PWR-C1-715WAC-P"
    why:
      "part_number": "the pack models PWR-C1-715WAC-P; upstream's file gives PWR-C1-715WAC"

  - match: "device/Cisco/C82*"
    meta: {category: router, family: Catalyst 8200}
  - match: "device/Cisco/C8200-1N-4T"
    why:
      "drop/front_image": "the pack ships its own rendered photos (model3d.renders)"
      "drop/rear_image": "the pack ships its own rendered photos (model3d.renders)"
  - match: "device/Cisco/C9200CX-*"
    meta: {family: Catalyst 9200CX}
    why:
      "drop/front_image": "the pack ships its own rendered photos (model3d.renders)"
      "drop/rear_image": "the pack ships its own rendered photos (model3d.renders)"
      "console-ports/Console": "the console is a USB micro-B port only; there is no RJ45 console (C9200CX hardware installation guide, Product Overview)"
  - match: "device/Cisco/C9800-*"
    meta: {category: wireless-controller, family: Catalyst 9800}
    why:
      "drop/subdevice_role": "modelled as the unit alone with its own rack units, not as a child of a tray (REVIEW-22 answer 2)"
  - match: "device/Cisco/FPR1*"
    meta: {category: firewall, family: Firepower 1000}
  - match: "device/Generic/PP-*"
    meta: {category: patch-panel, family: Generic patch panels}
  - match: "device/Generic/FP-*"
    meta: {category: patch-panel, family: Generic fibre panels}
  - match: "module/Cisco/C3850-NM-*"
    meta: {family: Catalyst 9300}

  - match: "device/Cisco/C83*"
    meta: {category: router, family: Catalyst 8300}
  - match: "device/Cisco/WS-C3650-*"
    meta: {category: switch, family: Catalyst 3650}
  - match: "module/Cisco/PWR-C2-*"
    meta: {family: Catalyst 3650}
  - match: "module/Cisco/FAN-T1"
    meta: {family: Catalyst 3650}
  - match: "module/Cisco/C3650-*"
    meta: {family: Catalyst 3650}
  - match: "device/Fortinet/*"
    meta: {category: firewall, family: FortiGate}
    why:
      "drop/front_image": "the pack ships its own rendered photos (model3d.renders)"
      "drop/rear_image": "the pack ships its own rendered photos (model3d.renders)"
  - match: "device/SonicWall/*"
    meta: {category: firewall, family: SonicWall NSA}
  - match: "device/Netgear/*"
    meta: {category: switch, family: Netgear smart managed}
  - match: "device/HPE/J98*"
    meta: {category: switch, family: Aruba 5400R zl2}
  - match: "module/HPE/*"
    meta: {family: Aruba 5400R zl2}
  - match: "device/Cisco/WS-C3650-48PD"
    why:
      "interfaces/GigabitEthernet0/0": "the management port; upstream's file for this model doesn't list it"

  # -- which pack each entry goes into (the last rule that fits wins) --------
  - match: "device/Cisco/C9200*"
    pack: cisco-catalyst-9200
  - match: "device/Cisco/C9300*"
    pack: cisco-catalyst-9300
  - match: "device/Cisco/C9500*"
    pack: cisco-catalyst-9500
  - match: "device/Generic/PDU-*"
    pack: generic-racks
  - match: "module/Cisco/C9200*"
    pack: cisco-catalyst-9200
  - match: "module/Cisco/PWR-C[56]-*"
    pack: cisco-catalyst-9200
  - match: "module/Cisco/C9300*"
    pack: cisco-catalyst-9300
  - match: "module/Cisco/PWR-C1-*"
    pack: cisco-catalyst-9300
  - match: "module/Cisco/C9500-*"
    pack: cisco-catalyst-9500
  - match: "module/Cisco/C9K-*"
    pack: cisco-catalyst-9500
  - match: "module/Cisco/PWR-C4-*"
    pack: cisco-catalyst-9500
  - match: "module/Cisco/FAN-T4-R"
    pack: cisco-catalyst-9500
  # The one fan the 9200 and the 9300 share: both packs carry it.
  - match: "module/Cisco/FAN-T2"
    pack: [cisco-catalyst-9200, cisco-catalyst-9300]
  - match: "device/Cisco/C8*"
    pack: cisco-8200
  - match: "device/Cisco/C9800-*"
    pack: cisco-catalyst-9800
  - match: "device/Cisco/FPR1*"
    pack: cisco-firepower-1000
  - match: "device/Generic/PP-*"
    pack: generic-panels
  - match: "device/Generic/FP-*"
    pack: generic-panels
  - match: "module/Cisco/C3850-NM-*"
    pack: cisco-catalyst-9300
  - match: "device/Cisco/C83*"
    pack: cisco-catalyst-8300
  - match: "device/Cisco/WS-C3650-*"
    pack: cisco-catalyst-3650
  - match: "module/Cisco/PWR-C2-*"
    pack: cisco-catalyst-3650
  - match: "module/Cisco/FAN-T1"
    pack: cisco-catalyst-3650
  - match: "module/Cisco/C3650-*"
    pack: cisco-catalyst-3650
  - match: "device/Fortinet/*"
    pack: fortinet-fortigate
  - match: "device/SonicWall/*"
    pack: sonicwall-nsa
  - match: "device/Netgear/*"
    pack: netgear-switches
  - match: "device/HPE/*"
    pack: hpe-aruba-5400
  - match: "module/HPE/*"
    pack: hpe-aruba-5400
  - match: "pluggable/Cisco/*"
    pack: cisco-optics
  - match: "pluggable/Cisco/STACK-T4"
    pack: cisco-catalyst-9200
  - match: "pluggable/Cisco/STACK-T[13]*"
    pack: cisco-catalyst-9300
  - match: "pluggable/Cisco/CAB-SPWR"
    pack: cisco-catalyst-9300
  - match: "pluggable/Generic/*"
    pack: generic-connectors
  - match: "pluggable/Generic/BLANK-*"
    pack: generic-racks
  - match: "pluggable/Generic/CM-*"
    pack: generic-racks
  - match: "pluggable/Generic/SHELF-*"
    pack: generic-racks
  - match: "rack-kit/*"
    pack: generic-racks
  - match: "rack-type/*"
    pack: generic-racks
