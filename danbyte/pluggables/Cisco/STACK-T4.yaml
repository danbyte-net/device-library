# yaml-language-server: $schema=../../schema/pluggable.schema.json
format: danbyte-library/v1
meta:
  category: pluggable
  roles: [stacking, cable]
  family: Catalyst 9200
  summary: Data stack cable for Catalyst 9200/9200L stacking, in 50 cm, 1 m and 3 m lengths.
  links:
    - kind: datasheet
      title: Cisco Catalyst 9200 Series Switches Data Sheet
      url: https://www.cisco.com/c/en/us/products/collateral/switches/catalyst-9200-series-switches/nb-06-cat9200-ser-data-sheet-cte-en.html
    - kind: install-guide
      title: Cisco Catalyst 9200 Series Switches Hardware Installation Guide
      url: https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst9200/hardware/install/b-c9200-hig.html
    - kind: product-page
      title: Catalyst 9200 Switches Overview
      url: https://www.cisco.com/c/en/us/products/switches/catalyst-9200-series-switches/index.html

name: STACK-T4
kind: cord
connector: stack
fits: [cisco-stackwise-160, cisco-stackwise-80]
parts: [STACK-T4-50CM, STACK-T4-1M, STACK-T4-3M]
standard: StackWise-160
comments: 'Cisco StackWise-160 / StackWise-80 stack cable end (Catalyst 9200 with C9200-STACK-KIT, 9200L): one connector head, a metal shell with a flat plug into the stack adapter''s socket, two knurled thumbscrews at diagonal corners (upper left and lower right seen from the rear), a round cable straight out of the middle of the rear, 40 mm stub to the cable empty. Minimum bend radius 66 mm, the 3 m cable 91 mm (Cisco C9200 HIG table 1). Head size from Cisco''s HIG figure 14 and product photos (no published drawing), +-2 mm; the 6.5 mm cable diameter is an estimate. Origin is the stack port anchor. CABLE is recoloured by Danbyte.'
cable:
  profile: round
  jacket_mm: 6.5
  min_bend_mm: 66
  min_bend_by_part: {STACK-T4-3M: 91}

model3d: {file: assets/Cisco/STACK-T4.glb}
