name: STACK-T2
kind: cord
connector: stack
fits: [cisco-stackwise-160]
parts: [STACK-T2-50CM, STACK-T2-1M, STACK-T2-3M]
standard: StackWise-160
comments: 'Cisco StackWise-160 stack cable end for the Catalyst 3650 (with C3650-STACK-KIT): one connector head, a metal shell with a flat plug into the adapter''s socket, knurled thumbscrews, a round cable out of the rear, 40 mm stub to the cable empty. Model: the pack''s STACK-T4 head (same design in Cisco''s HIG figure 2-14 and the product photos), +-2 mm. Bend radii: the C9200 HIG values of STACK-T4 (66 mm, 3 m: 91 mm); Cisco''s C3650 value was not found. Origin is the stack port anchor. CABLE is recoloured by Danbyte.'
cable:
  profile: round
  jacket_mm: 6.5
  min_bend_mm: 66
  min_bend_by_part: {STACK-T2-3M: 91}

