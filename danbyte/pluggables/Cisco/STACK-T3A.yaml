name: STACK-T3A
kind: cord
connector: stack
fits: [cisco-stackwise-320]
parts: [STACK-T3A-50CM, STACK-T3A-1M, STACK-T3A-3M]
standard: StackWise-320
comments: 'Cisco StackWise-320 stack cable end (Catalyst 9300L; C9300L-STACK-A adapter): one connector head, dark straight-sided metal shell, latch window with two screws on top, a nose and flat plug into the adapter''s socket, a round cable straight out of the back, 40 mm stub to the cable empty. Cisco C9300 HIG: the connector is held by a spring latch; each StackWise link must use the matching adapter and cable at both ends (C9300L-STACK + STACK-T3, C9300L-STACK-A + STACK-T3A, do not mix). Minimum bend radius 41 mm, the 3 m cable 82 mm (HIG Connector and Cable Specifications, table 4). Head size from product photos scaled to our stack slot, +-2 mm; the 8 mm cable diameter is an estimate. Origin is the stack port anchor. CABLE is recoloured by Danbyte.'
cable:
  profile: round
  jacket_mm: 8.0
  min_bend_mm: 41
  min_bend_by_part: {STACK-T3A-3M: 82}

