comments: 'Cisco StackPower cable end (Catalyst 9300 / 9300X StackPower ports; not C9300L): black keyed plug nose in the receptacle, metal sleeve and backshell, one captive screw along the top with a knurled knob, moulded boot, the coloured band (material END_BAND) and an 8.5 mm round cable, 40 mm stub to the cable empty. Cisco: the end with the green band connects only to a switch; the end with the yellow band connects to a switch or an XPS. Sizes from product photos scaled to our 25.0 x 16.4 mm receptacles (Cisco publishes no drawing, diameter or bend radius), +-2 mm; min_bend_mm is an estimate. Origin is the StackPower port anchor. CABLE and END_BAND are recoloured by Danbyte.'
