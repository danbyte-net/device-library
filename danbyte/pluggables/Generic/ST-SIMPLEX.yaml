comments: ST (BFOC/2.5, IEC 61754-2) simplex patch-cord end - ribbed nickel bayonet coupling nut 9.5 mm x 12.7 mm (slots for the coupler lugs), keyed body, 2.5 mm ceramic ferrule standing 7.9 mm out of the nut, tapered boot, 2.8 mm round jacket ending at the cable empty (+Z along the cable, +Y up). Sizes from the Amphenol Socapex 953 series ST data sheet. Origin is the mating face (the coupler barrel's end). LC_BODY (the boot) and FIBRE are recoloured by Danbyte.
cable: {profile: round, jacket_mm: 2.8, min_bend_mm: 30}
