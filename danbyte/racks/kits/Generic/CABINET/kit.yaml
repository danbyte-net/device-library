comments: 'Generic enclosed 19-inch cabinet, unbranded. Parts modelled in place for the 42U 600 x 1000 reference (rail depth 740 mm, U1 at z 130 mm, front rail face = ear plane at y 100 mm). Stretched parts are 1000 mm meshes with their origin at the start of each stretch axis. Rails: EIA-310, 465.1 mm hole columns, 9.5 mm square holes at 6.35 / 22.225 / 38.1 mm per U. Perforation: FRAME_PERF, 6.4 mm holes on an 8 mm tile (danbyte_tile_mm 8), alpha MASK. Pathways: rear cable channels path:vertical:left/right:rear in front of the rear rail face beside the rails (y 744-836, inner 52 x 89 mm, open inner, real depth, stretch z); roof entries front-left / rear-right (brush), rear floor entry (open); 0U channels rear left / right in the corners behind the rear rails (x +-258, y 931, from z 165 mm, 40U), PDU outlets toward the cabinet centre (an IEC plug stands 84 mm proud of its outlet: facing the rear door it would hit the door); add-on parts: front finger managers path:vertical:left/right:front behind the front posts (inner 52 x 88.5, open front, pitch 44.45, real depth, :cover parts) and full-depth channels path:vertical:left/right:full (open inner).'
