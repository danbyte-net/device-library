name: MPO-12
kind: plug
connector: mpo
fits: [mpo-8, mpo-12]
comments: "MPO-12 trunk end - inner housing seated in the receptacle (key up), coupling sleeve with grip ridges, black boot, 3.0 mm round trunk ending at the cable empty. Origin is the mating face. LC_BODY (housing) and FIBRE (trunk) are recoloured by Danbyte."
cable:
  profile: round
  jacket_mm: 3.0
  min_bend_mm: 30
# danbyte: meta (spec 1.14 section 8): only what the listed sources state
meta:
  category: pluggable
  roles: [fibre, cord]
  family: "Fibre connectors"
  summary: "MPO-12 multi-fibre trunk end."
model3d:
  file: models/Generic/MPO-12.glb
