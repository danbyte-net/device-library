comments: "IEC 60320 C20 cord plug (male, 16 A) for PDU outlets: shroud into the outlet pocket around the female insert, three pins (IEC 60320-1 sheet C20), moulded body with grip ribs, strain relief, 9.0 mm cord, 40 mm stub to the cable empty. Origin is the outlet's port anchor; the earth side is +Y (every outlet anchor's +Y points at the earth side). Body size typical, +-2 mm; min_bend_mm is an estimate. CABLE is recoloured by Danbyte."
