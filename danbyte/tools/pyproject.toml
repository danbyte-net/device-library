[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "danbyte-lib"
version = "0.1.0"
description = "Validate, preview and build the Danbyte device library (overlays on the NetBox device-type library)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CC0-1.0" }
dependencies = ["PyYAML>=6.0", "jsonschema>=4.18"]

[project.optional-dependencies]
images = ["Pillow>=10"]
test = ["pytest>=8"]

[project.scripts]
danbyte-lib = "danbyte_lib.cli:main"

[tool.setuptools]
packages = ["danbyte_lib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "--import-mode=importlib"
