    model_sha256: e52edb7cdbe9e318b540dd640201c208161c1cd45ab1b47bd3879373dc6a4f63

# rack_mount (spec 1.11): ears flush with the front plate (REVIEW-22: front position only)
rack_mount:
  ears: true
  positions: {front: 0}
  default: front
  rails: none
