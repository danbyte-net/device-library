format: danbyte-library/v1
upstream: danbyte/types-new/device-types/Generic/FP-LC-48.yaml
meta:
  category: patch-panel
  roles: [fibre, cabling]
  family: Generic panels
  summary: 1U fibre panel with 48 LC duplex couplers (96 fibres) in two rows of 24.

model3d:
  file: assets/Generic/FP-LC-48.glb
  far: assets/Generic/FP-LC-48.far.glb
  renders:
    front: assets/Generic/FP-LC-48.front.webp
    rear: assets/Generic/FP-LC-48.rear.webp
