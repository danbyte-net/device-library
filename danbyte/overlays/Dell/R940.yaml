# yaml-language-server: $schema=../../schema/overlay.schema.json
format: danbyte-library/v1
upstream: device-types/Dell/PowerEdge-R940.yaml
meta:
  category: server
  roles: [compute]
  family: PowerEdge
  summary: 3U four-socket rack server; modelled with 24 x 2.5-inch front drives, two PSUs, thirteen PCIe slots, a four-port network daughter card, serial and the iDRAC port.
  links:
    - kind: install-guide
      title: Dell PowerEdge R940 Installation and Service Manual
      url: https://dl.dell.com/topicspdf/poweredge-r940_owners-manual_en-us.pdf
    - kind: install-guide
      title: Dell PowerEdge R940 Installation and Service Manual (Rev A09, with technical specifications)
      url: https://dl.dell.com/topicspdf/poweredge-r940_owners-manual4_en-us.pdf
    - kind: datasheet
      title: Dell PowerEdge R940 Spec Sheet
      url: https://i.dell.com/sites/doccontent/shared-content/data-sheets/en/Documents/poweredge-r940-spec-sheet.pdf
  sources:
    - https://github.com/netbox-community/devicetype-library/blob/master/device-types/Dell/PowerEdge-R940.yaml

# weight from the ISM spec chapter (R940-ISM4 table 18, 49.9 kg)
weight: 49.9
weight_unit: kg
power-ports:
  remove:
    - name: Power 3
      why: the R940 has two hot-plug PSUs (Dell ISM rear view fig. 8, table 10); upstream lists four
    - name: Power 4
      why: the R940 has two hot-plug PSUs (Dell ISM rear view fig. 8, table 10); upstream lists four
  Power 1: {type: iec-60320-c20}
  Power 2: {type: iec-60320-c20}

interfaces:
  remove:
    - name: 10GbE 2'
      why: upstream's name with a stray quote; the network daughter card has four ports, 10GbE 1-4
    - name: 10GbE 5
      why: the network daughter card has four ports (Dell ISM rear view item 3, R940 spec sheet); upstream lists eight
    - name: 10GbE 6
      why: the network daughter card has four ports (Dell ISM rear view item 3, R940 spec sheet); upstream lists eight
    - name: 10GbE 7
      why: the network daughter card has four ports (Dell ISM rear view item 3, R940 spec sheet); upstream lists eight
    - name: 10GbE 8
      why: the network daughter card has four ports (Dell ISM rear view item 3, R940 spec sheet); upstream lists eight
  add:
    - name: 10GbE 2
      type: 10gbase-t
      why: the second network daughter card port, named without upstream's stray quote
      after: 10GbE 1

