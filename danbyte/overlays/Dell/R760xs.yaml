meta:
  category: server
  roles: [compute]
  family: PowerEdge
  summary: 2U two-socket rack server; modelled with 16 + 8 x 2.5-inch front drives, two rear drives, two 60 mm PSU bays, six low-profile PCIe slots, an OCP 3.0 slot, two RJ45 and the iDRAC port.
  links:
    - kind: install-guide
      title: Dell PowerEdge R760xs Installation and Service Manual
      url: https://www.dell.com/support/manuals/poweredge-r760xs/r760xs_ism_pub/about-this-document
    - kind: install-guide
      title: Dell PowerEdge R760xs Installation and Service Manual (PDF)
      url: https://dl.dell.com/content/manual46164916-poweredge-r760xs-installation-and-service-manual.pdf?language=en-us
    - kind: other
      title: Dell PowerEdge R760xs Technical Guide
      url: https://www.delltechnologies.com/asset/en-gb/products/servers/technical-support/poweredge-r760xs-technical-guide.pdf
  sources:
    - https://github.com/netbox-community/devicetype-library/blob/master/device-types/Dell/PowerEdge-R760xs.yaml

