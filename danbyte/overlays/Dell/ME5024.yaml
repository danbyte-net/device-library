# yaml-language-server: $schema=../../schema/overlay.schema.json
# Danbyte-only hardware: the NetBox part is in the upstream: base, for offering to NetBox later.
format: danbyte-library/v1
upstream: danbyte/types-new/device-types/Dell/ME5024.yaml
meta:
  category: storage
  roles: [san, iscsi]
  family: PowerVault ME5
  summary: 2U storage array for 24 x 2.5-inch drives with two hot-swap controller modules and two hot-swap 580 W power cooling modules.
  links:
    - kind: install-guide
      title: Dell PowerVault ME5 Series Storage System Owner's Manual
      url: https://dl.dell.com/content/manual52191289-dell-powervault-me5-series-storage-system-owner-s-manual.pdf?language=en-us
    - kind: install-guide
      title: 'ME5 Series Deployment Guide: Install the 2U enclosure using toolless rails'
      url: https://www.dell.com/support/manuals/en-us/powervault-me5024/me5_series_dg/install-the-2u-enclosure-using-toolless-rails?guid=guid-2e377ed1-f14d-49fd-8383-5244986d760b&lang=en-us
    - kind: config-guide
      title: 'ME5 Series CLI Reference Guide: port'
      url: https://www.dell.com/support/manuals/en-us/powervault-me5024/me5_series_cli/port?guid=guid-0343cb7f-e9c2-4ca9-88b6-7ae65dc8d2d8&lang=en-us
  sources:
    - https://github.com/netbox-community/devicetype-library/blob/master/device-types/Dell/PowerVault-ME5012.yaml
    - https://www.dell.com/support/manuals/en-us/powervault-me5024/me5_series_cli/show-ports?guid=guid-b912da10-7722-4788-b151-3820b054861d&lang=en-us

module-bays:
  PSU-1:
    modules: [PowerVault ME5 2U Power Cooling Module 580W]
  PSU-2:
    modules: [PowerVault ME5 2U Power Cooling Module 580W]
  Controller 1:
    modules: [403-BCQU, 403-BCQV, 403-BCQT, 403-BCQP]
  Controller 2:
    modules: [403-BCQU, 403-BCQV, 403-BCQT, 403-BCQP]

model3d:
  file: assets/Dell/ME5024.glb
  far: assets/Dell/ME5024.far.glb
  empty: filler
  leds:
    POWER: {source: device.status}
    FAULT:
      source: device.status
      only: [amber, red]
    IDENTITY: {source: device.locate}
    D0_ACT: {source: none}
    D0_FAULT: {source: none}
    D1_ACT: {source: none}
    D1_FAULT: {source: none}
    D2_ACT: {source: none}
    D2_FAULT: {source: none}
    D3_ACT: {source: none}
    D3_FAULT: {source: none}
    D4_ACT: {source: none}
    D4_FAULT: {source: none}
    D5_ACT: {source: none}
    D5_FAULT: {source: none}
    D6_ACT: {source: none}
    D6_FAULT: {source: none}
    D7_ACT: {source: none}
    D7_FAULT: {source: none}
    D8_ACT: {source: none}
    D8_FAULT: {source: none}
    D9_ACT: {source: none}
    D9_FAULT: {source: none}
    D10_ACT: {source: none}
    D10_FAULT: {source: none}
    D11_ACT: {source: none}
    D11_FAULT: {source: none}
    D12_ACT: {source: none}
    D12_FAULT: {source: none}
    D13_ACT: {source: none}
    D13_FAULT: {source: none}
    D14_ACT: {source: none}
    D14_FAULT: {source: none}
    D15_ACT: {source: none}
    D15_FAULT: {source: none}
    D16_ACT: {source: none}
    D16_FAULT: {source: none}
    D17_ACT: {source: none}
    D17_FAULT: {source: none}
    D18_ACT: {source: none}
    D18_FAULT: {source: none}
    D19_ACT: {source: none}
    D19_FAULT: {source: none}
    D20_ACT: {source: none}
    D20_FAULT: {source: none}
    D21_ACT: {source: none}
    D21_FAULT: {source: none}
    D22_ACT: {source: none}
    D22_FAULT: {source: none}
    D23_ACT: {source: none}
    D23_FAULT: {source: none}
    port:*: {source: interface.oper_status}
  renders:
    front: assets/Dell/ME5024.front.webp
    rear: assets/Dell/ME5024.rear.webp
    iso: assets/Dell/ME5024.iso.webp
    model_sha256: e051eca361b3970f7edf9ae65e450ea786d68472a5c8094933a4dec0e7ee79d9
    modules:
      Controller 1: 403-BCQU
      Controller 2: 403-BCQU
      PSU-1: PowerVault ME5 2U Power Cooling Module 580W
      PSU-2: PowerVault ME5 2U Power Cooling Module 580W

# rack_mount (spec 1.11): ME5 Deployment Guide 'Install the 2U enclosure using toolless rails': static
rack_mount:
  ears: true
  positions: {front: 0}
  default: front
  rails: fixed
