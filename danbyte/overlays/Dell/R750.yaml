# yaml-language-server: $schema=../../schema/overlay.schema.json
format: danbyte-library/v1
upstream: device-types/Dell/PowerEdge-R750.yml
meta:
  category: server
  roles: [compute]
  family: PowerEdge
  summary: 2U two-socket rack server; modelled with 24 x 2.5-inch front drives, two 86 mm PSU bays, eight PCIe slots, an OCP 3.0 slot, two LOM RJ45 and the iDRAC port.
  links:
    - kind: install-guide
      title: Dell PowerEdge R750 Installation and Service Manual
      url: https://dl.dell.com/topicspdf/poweredge-r750_owners-manual_en-us.pdf
    - kind: datasheet
      title: Dell PowerEdge R750 Technical Specifications
      url: https://dl.dell.com/topicspdf/poweredge-r750_owners-manual2_en-us.pdf
    - kind: other
      title: Dell PowerEdge R750 Technical Guide
      url: https://i.dell.com/sites/csdocuments/Product_Docs/en/poweredge-r750-technical-guide.pdf
  sources:
    - https://github.com/netbox-community/devicetype-library/blob/master/device-types/Dell/PowerEdge-R750.yml

console-ports:
  remove:
    - name: Rear Serial
      why: 'upstream console-ports list left out (its one item ''Rear Serial'', de-9): Dell''s ISM rear view (figure + callout table) shows no serial port on this model; add it back with its anchor once a photo shows one'

module-bays:
  PSU-1:
    modules: [DELL-PSU-86MM-2400W]
  PSU-2:
    modules: [DELL-PSU-86MM-2400W]

