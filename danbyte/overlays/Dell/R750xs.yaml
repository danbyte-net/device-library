# yaml-language-server: $schema=../../schema/overlay.schema.json
format: danbyte-library/v1
upstream: device-types/Dell/PowerEdge-R750xs.yaml
meta:
  category: server
  roles: [compute]
  family: PowerEdge
  summary: 2U two-socket rack server; modelled with 16 + 8 x 2.5-inch front drives, two rear drives, two 60 mm PSU bays, six PCIe slots, an OCP 3.0 slot, two RJ45 and the iDRAC port.
  links:
    - kind: install-guide
      title: Dell PowerEdge R750xs Installation and Service Manual
      url: https://dl.dell.com/topicspdf/poweredge-r750xs_owners-manual_en-us.pdf
    - kind: datasheet
      title: Dell PowerEdge R750xs Technical Specifications
      url: https://dl.dell.com/topicspdf/poweredge-r750xs_owners-manual2_en-us.pdf
    - kind: other
      title: Dell PowerEdge R750xs Technical Guide
      url: https://i.dell.com/sites/csdocuments/Product_Docs/en/dell-emc-poweredge-r750xs-technical-guide.pdf
  sources:
    - https://github.com/netbox-community/devicetype-library/blob/master/device-types/Dell/PowerEdge-R750xs.yaml

console-ports:
  remove:
    - name: Rear Serial
      why: 'upstream console-ports list left out (its one item ''Rear Serial'', de-9): Dell''s ISM rear view (figure + callout table) shows no serial port on this model; add it back with its anchor once a photo shows one'

module-bays:
  remove:
    - name: NUMA 1 - PCIe slot 7 - FH
      why: 'upstream bay ''NUMA 1 - PCIe slot 7 - FH'' left out: Dell''s R750xs rear figure (ISM fig. 8, table 5) and TS slot table show six PCIe slots (the R750''s eight were copied upstream) upstream bay ''NUMA 1 - PCIe slot 8 - FH'' left out: six PCIe slots, as slot 7 above front drive configuration modelled: 16 x 2.5-inch SAS/SATA + 8 x 2.5-inch NVMe (ISM front view figure 1; the R750''s 24 x 2.5-inch drawing); drive carriers modelled in place (filled), no drive bays the optional front bezel is not modelled…'
    - name: NUMA 1 - PCIe slot 8 - FH
      why: Dell's R750xs rear figure (ISM fig. 8, table 5) and slot table show six PCIe slots; upstream copied the R750's eight
  PSU-1:
    position: '1'
    modules: [DELL-PSU-60MM-1400W]
    why: slot names kept as upstream, but Dell's TS slot table lists all six slots as low profile, half length
  PSU-2:
    position: '2'
    modules: [DELL-PSU-60MM-1400W]

