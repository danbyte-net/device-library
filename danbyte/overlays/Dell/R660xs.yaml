meta:
  category: server
  roles: [compute]
  family: PowerEdge
  summary: 1U two-socket rack server; modelled with 10 x 2.5-inch front drives, two 60 mm PSU bays, three low-profile PCIe slots, two RJ45 and the iDRAC port.
  links:
    - kind: install-guide
      title: Dell PowerEdge R660xs Installation and Service Manual
      url: https://www.dell.com/support/manuals/poweredge-r660xs/r660xs_ism_pub/about-this-document
    - kind: install-guide
      title: Dell PowerEdge R660xs Installation and Service Manual (PDF)
      url: https://dl.dell.com/content/manual42812694-dell-poweredge-r660xs-installation-and-service-manual.pdf?language=en-us
    - kind: other
      title: Dell PowerEdge R660xs Technical Guide
      url: https://www.delltechnologies.com/asset/en-us/products/servers/technical-support/poweredge-r660xs-technical-guide.pdf
