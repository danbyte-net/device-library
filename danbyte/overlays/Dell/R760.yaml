# yaml-language-server: $schema=../../schema/overlay.schema.json
format: danbyte-library/v1
upstream: device-types/Dell/PowerEdge-R760.yml
meta:
  category: server
  roles: [compute]
  family: PowerEdge
  summary: 2U two-socket rack server; modelled with 24 x 2.5-inch front drives, two 86 mm PSU bays, eight PCIe slots, an OCP 3.0 slot, two LOM RJ45 and the iDRAC port.
  links:
    - kind: install-guide
      title: Dell PowerEdge R760 Installation and Service Manual
      url: https://www.dell.com/support/manuals/en-us/oth-r760/per760_ism_pub/
    - kind: install-guide
      title: Dell PowerEdge R760 Installation and Service Manual (PDF)
      url: https://dl.dell.com/content/manual24680455-dell-poweredge-r760-installation-and-service-manual.pdf?language=en-us
  sources:
    - https://github.com/netbox-community/devicetype-library/blob/master/device-types/Dell/PowerEdge-R760.yml

console-ports:
  remove:
    - name: Rear Serial
      why: 'upstream console-port ''Rear Serial'' (de-9) left out: Dell''s ISM rear view shows no serial port on this model (an optional part at most); add it back with its anchor once a photo shows it'

module-bays:
  PSU-1:
    modules: [DELL-PSU-86MM-2400W]
  PSU-2:
    modules: [DELL-PSU-86MM-2400W]

