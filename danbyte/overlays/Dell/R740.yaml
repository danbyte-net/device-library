format: danbyte-library/v1
upstream: device-types/Dell/PowerEdge-R740.yaml
meta:
  category: server
  roles: [compute]
  family: PowerEdge
  summary: 2U two-socket rack server; modelled with 16 x 2.5-inch front drives and a slim optical drive, two PSU bays, eight PCIe slots, a network daughter card bay, serial and the iDRAC port.
  links:
    - kind: install-guide
      title: Dell PowerEdge R740 Installation and Service Manual
      url: https://dl.dell.com/topicspdf/poweredge-r740_owners-manual_en-us.pdf
    - kind: datasheet
      title: Dell PowerEdge R740 Spec Sheet
      url: https://i.dell.com/sites/csdocuments/Product_Docs/en/poweredge-r740-specsheet.pdf
    - kind: other
      title: Dell PowerEdge R740 / R740xd Technical Guide
      url: https://i.dell.com/sites/csdocuments/Shared-Content_data-Sheets_Documents/en/aa/PowerEdge_R740_R740xd_Technical_Guide.pdf
  sources:
    - https://github.com/netbox-community/devicetype-library/blob/master/device-types/Dell/PowerEdge-R740.yaml

module-bays:
