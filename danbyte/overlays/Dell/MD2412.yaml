    rear: assets/Dell/MD2412.rear.webp
    iso: assets/Dell/MD2412.iso.webp
    model_sha256: b7bd9169bfff647c5825441a22bf3b9aa1b6d4430e0d31ad9b64d117b8de9c32
    modules: {EMM1: PowerVault MD2412 EMM, EMM2: PowerVault MD2412 EMM, PSU A: 4H60R, PSU B: 4H60R}

# rack_mount (spec 1.11): MD24OM 'Installing rails' / 'Installing the enclosure': the rails are fixed to
rack_mount:
  ears: true
  positions: {front: 0}
  default: front
  rails: fixed
