# yaml-language-server: $schema=../../schema/overlay.schema.json
format: danbyte-library/v1
upstream: device-types/Dell/PowerVault-MD2412.yaml
meta:
  category: storage
  roles: [jbod, sas]
  family: PowerVault MD24
  summary: 2U direct-attach SAS4 expansion enclosure for 12 x 3.5-inch drives, two hot-swap EMMs and two hot-swap 800 W PSUs.
  links:
    - kind: install-guide
      title: MD2412 and MD2424 Direct-Attach Storage for PowerEdge Servers Owner's Manual
      url: https://dl.dell.com/content/manual48914611-md2412-and-md2424-direct-attach-storage-for-poweredge-servers-owner-s-manual.pdf?language=en-us
    - kind: support
      title: PowerVault MD2412 support
      url: https://www.dell.com/support/product-details/en-uk/product/storage-md2412/overview
  sources:
    - https://github.com/netbox-community/devicetype-library/blob/master/device-types/Dell/PowerVault-MD2412.yaml

interfaces:
  remove:
    - name: EMM1 SAS Port 1
      why: 'upstream interfaces list left out (its four items "EMM1 SAS Port 1", "EMM1 SAS Port 2", "EMM2 SAS Port 1", "EMM2 SAS Port 2", type other): they belong to the EMMs, so the EMM module type (''PowerVault MD2412 EMM'') has them as "EMM{module} SAS Port 1/2"; bays EMM1 / EMM2 (position 1 / 2) give the same four names once both EMMs are installed (owner: EMMs are hot-swap modules)'
    - name: EMM1 SAS Port 2
      why: 'upstream interfaces list left out (its four items "EMM1 SAS Port 1", "EMM1 SAS Port 2", "EMM2 SAS Port 1", "EMM2 SAS Port 2", type other): they belong to the EMMs, so the EMM module type (''PowerVault MD2412 EMM'') has them as "EMM{module} SAS Port 1/2"; bays EMM1 / EMM2 (position 1 / 2) give the same four names once both EMMs are installed (owner: EMMs are hot-swap modules)'
    - name: EMM2 SAS Port 1
      why: 'upstream interfaces list left out (its four items "EMM1 SAS Port 1", "EMM1 SAS Port 2", "EMM2 SAS Port 1", "EMM2 SAS Port 2", type other): they belong to the EMMs, so the EMM module type (''PowerVault MD2412 EMM'') has them as "EMM{module} SAS Port 1/2"; bays EMM1 / EMM2 (position 1 / 2) give the same four names once both EMMs are installed (owner: EMMs are hot-swap modules)'
    - name: EMM2 SAS Port 2
      why: 'upstream interfaces list left out (its four items "EMM1 SAS Port 1", "EMM1 SAS Port 2", "EMM2 SAS Port 1", "EMM2 SAS Port 2", type other): they belong to the EMMs, so the EMM module type (''PowerVault MD2412 EMM'') has them as "EMM{module} SAS Port 1/2"; bays EMM1 / EMM2 (position 1 / 2) give the same four names once both EMMs are installed (owner: EMMs are hot-swap modules)'

module-bays:
  PSU A:
    modules: [4H60R]
  PSU B:
    modules: [4H60R]
  add:
    - name: EMM1
      position: '1'
      label: EMM 1
      description: EMM-A / Slot 1 (left seen from the rear)
      modules: [PowerVault MD2412 EMM]
      why: 'EMM bays (MD24OM fig. 2: "EMM 1 (EMM-A/Slot1)" left, "EMM 2 (EMM-B/Slot2)" right seen from the rear;'
    - name: EMM2
      position: '2'
      label: EMM 2
      description: EMM-B / Slot 2 (right seen from the rear)
      modules: [PowerVault MD2412 EMM]
      why: 'EMM bays (MD24OM fig. 2: "EMM 1 (EMM-A/Slot1)" left, "EMM 2 (EMM-B/Slot2)" right seen from the rear;'

