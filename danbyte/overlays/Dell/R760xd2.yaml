    front: assets/Dell/R760xd2.front.webp
    rear: assets/Dell/R760xd2.rear.webp
    iso: assets/Dell/R760xd2.iso.webp
    model_sha256: b61bc346c65aa23ca0894f8b2780fb01a6b9bee91c86f67cc7e6393884412a2a
    modules: {PSU-1: DELL-PSU-60MM-1400W, PSU-2: DELL-PSU-60MM-1400W, NUMA 0 - OCP slot 1: 540-BFLP}

# rack_mount (spec 1.11; owner rule for servers): the control-panel flanks are the ears, front of the flanks at
rack_mount:
  ears: true
  positions: {front: 0}
  default: front
  rails: sliding
