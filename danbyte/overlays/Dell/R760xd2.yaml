# yaml-language-server: $schema=../../schema/overlay.schema.json
format: danbyte-library/v1
upstream: device-types/Dell/PowerEdge-R760xd2.yaml
meta:
  category: server
  roles: [storage]
  family: PowerEdge
  summary: 2U storage-dense two-socket rack server with 24 x 3.5-inch drives (12 front, 12 in a top-load mid bay); two 60 mm PSU bays, five PCIe slots, an OCP 3.0 slot, two RJ45 and the iDRAC port.
  links:
    - kind: install-guide
      title: Dell PowerEdge R760xd2 Installation and Service Manual
      url: https://www.dell.com/support/manuals/poweredge-r760xd2/r760xd2_ism/about-this-document
    - kind: install-guide
      title: Dell PowerEdge R760xd2 Installation and Service Manual (PDF)
      url: https://dl.dell.com/content/manual30775379-dell-poweredge-r760xd2-installation-and-service-manual.pdf?language=en-us
    - kind: other
      title: Dell PowerEdge R760xd2 Technical Guide
      url: https://www.delltechnologies.com/asset/en-gb/products/servers/technical-support/poweredge-r760xd2-technical-guide.pdf
  sources:
    - https://github.com/netbox-community/devicetype-library/blob/master/device-types/Dell/PowerEdge-R760xd2.yaml

console-ports:
  remove:
    - name: Rear Serial
      why: 'upstream console-ports list left out (its one item ''Rear Serial'', de-9): Dell''s ISM rear view shows no serial port on this model (an optional part at most); add it back with its anchor once a photo shows it'

module-bays:
  PSU-1:
    modules: [DELL-PSU-60MM-1400W]
  PSU-2:
    modules: [DELL-PSU-60MM-1400W]

