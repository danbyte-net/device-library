# yaml-language-server: $schema=../../schema/overlay.schema.json
format: danbyte-library/v1
upstream: device-types/Palo Alto Networks/PA-3420.yaml
meta:
  category: firewall
  roles: [security]
  family: PA-3400 Series
  summary: 1RU next-generation firewall with 12 x 10G RJ45, 10 x SFP/SFP+, 4 x SFP28, HSCI, HA1-A/B, MGT and two 450 W PSU slots.
  links:
    - kind: datasheet
      title: Palo Alto Networks PA-3400 Series Data Sheet
      url: https://www.paloaltonetworks.com/apps/pan/public/downloadResource?pagePath=/content/pan/en_US/resources/datasheets/pa-3400-series
    - kind: install-guide
      title: PA-3400 Series Next-Gen Firewall Hardware Reference
      url: https://docs.paloaltonetworks.com/content/dam/techdocs/en_US/pdf/hardware/pa-3400-series/pa-3400-hardware-reference.pdf
    - kind: install-guide
      title: PA-3400 Series Quick Start Guide
      url: https://docs.paloaltonetworks.com/content/dam/techdocs/en_US/pdf/hardware/pa-3400-series/PA-3400-Quick-Start.pdf
  sources:
    - https://www.paloaltonetworks.com/services/support/end-of-life-announcements/hardware-end-of-life-dates
    - https://raw.githubusercontent.com/netbox-community/devicetype-library/master/device-types/Palo%20Alto%20Networks/PA-3420.yaml

# weight (HW ref Physical Specifications: 15.5 lb (7.03 kg)); upstream had 7
weight: 7.03
console-ports:
  add:
    - name: console-micro-usb
      type: usb-micro-b
      why: the front micro-USB console (HW ref front panel, "CONSOLE port (Micro USB)")

module-bays:
  PS1:
    modules: [450W AC Power Supply (PA-3400 / PA-1400 Series)]
    why: 'PSU bays (HW ref back panel: PS1 right, PS2 left seen from the rear; both ship with a 450 W AC supply); AC module by model, no'
  PS2:
    modules: [450W AC Power Supply (PA-3400 / PA-1400 Series)]

# model3d (spec section 8)
model3d:
  file: assets/PaloAlto/PA-3420.glb
  far: assets/PaloAlto/PA-3420.far.glb
  empty: filler
  renders:
    front: assets/PaloAlto/PA-3420.front.webp
    rear: assets/PaloAlto/PA-3420.rear.webp
    iso: assets/PaloAlto/PA-3420.iso.webp
    model_sha256: 916c139b1633608c349a29de872a2683d8e71f4f6287b428313a120aa149f24b
    modules:
      PS1: 450W AC Power Supply (PA-3400 / PA-1400 Series)
      PS2: 450W AC Power Supply (PA-3400 / PA-1400 Series)
  leds:
    SERVICE: {source: device.locate}
    POWER: {source: device.status}
    STATUS: {source: device.status}
    HA: {source: none}
    TEMP: {source: none}
    ALARM:
      source: device.status
      only: [red]
    FANS: {source: none}
    PS1:
      source: modules.status
      bays: [PS1]
    PS2:
      source: modules.status
      bays: [PS2]
    SPEED_ethernet1/13: {source: none}
    SPEED_ethernet1/14: {source: none}
    SPEED_ethernet1/15: {source: none}
    SPEED_ethernet1/16: {source: none}
    SPEED_ethernet1/17: {source: none}
    SPEED_ethernet1/18: {source: none}
    SPEED_ethernet1/19: {source: none}
    SPEED_ethernet1/20: {source: none}
    SPEED_ethernet1/21: {source: none}
    SPEED_ethernet1/22: {source: none}
    SPEED_ethernet1/23: {source: none}
    SPEED_ethernet1/24: {source: none}
    SPEED_ethernet1/25: {source: none}
    SPEED_ethernet1/26: {source: none}
    SPEED_hsci: {source: none}
    SPEED_ha1-a: {source: none}
    SPEED_ha1-b: {source: none}
    SPEED_management: {source: none}
    CON_L: {source: none}
    CON_R: {source: none}
    port:*: {source: interface.oper_status}

# rack_mount (spec 1.11): the four-post kit (PAN-PA-3400-RACK4, HW ref) ships in the box (QSG); ears in the
rack_mount:
  ears: true
  positions: {front: 0}
  default: front
  rails: fixed
