upstream: danbyte/types-new/device-types/Intel/R2208GZ4GC.yaml
meta:
  category: server
  roles: [compute]
  family: Intel Server System R2000GZ Family
  summary: 2U rack server (Intel Server Board S2600GZ) with 8 x 2.5-inch hot-swap bays, 4 x 1GbE, an RMM4 management port, two redundant PSU bays and two riser cages.
  lifecycle:
    end_of_sale: '2017-06-30'
    source: https://www.intel.com/content/www/us/en/products/sku/56262/intel-server-system-r2208gz4gc/specifications.html
  links:
    - kind: product-page
      title: Intel Server System R2208GZ4GC - Product Specifications
      url: https://www.intel.com/content/www/us/en/products/sku/56262/intel-server-system-r2208gz4gc/specifications.html
    - kind: datasheet
      title: Intel Server System R2000GZ/GL Product Family Technical Product Specification rev 2.2
      url: https://cdrdv2.intel.com/v1/dl/getContent/840741?fileName=r2000gzgl_tps_r2_2.pdf
    - kind: support
      title: Intel Server Products Technical Product Specifications (index)
      url: https://www.intel.com/content/www/us/en/support/articles/000006067/server-products.html
  sources: ['https://github.com/netbox-community/devicetype-library/tree/master/device-types/Intel']

module-bays:
