# yaml-language-server: $schema=../../schema/overlay.schema.json
format: danbyte-library/v1
upstream: device-types/Cisco/C9300L-24P-4G.yaml
meta: {category: switch, family: Catalyst 9300}
front_image: true
interfaces:
  StackPort1/1:
    type: cisco-stackwise-320
    why: typed by stack system so Danbyte picks the right stack cable head (export spec v1.12 section 8); upstream has the generic cisco-stackwise
  StackPort1/2:
    type: cisco-stackwise-320
    why: typed by stack system so Danbyte picks the right stack cable head (export spec v1.12 section 8); upstream has the generic cisco-stackwise

module-bays:
  PS-A:
    modules: [PWR-C1-350WAC-P, PWR-C1-715WAC-P, PWR-C1-1100WAC-P]
  PS-B:
    modules: [PWR-C1-350WAC-P, PWR-C1-715WAC-P, PWR-C1-1100WAC-P]
  FAN 1:
    modules: [FAN-T2]
  FAN 2:
    modules: [FAN-T2]
  FAN 3:
    modules: [FAN-T2]

model3d:
  file: assets/Cisco/C9300L-24P-4G.glb
  far: assets/Cisco/C9300L-24P-4G.far.glb
  empty: filler
  leds:
    SYS: {source: device.status}
    BEACON: {source: device.locate}
    STACK: {source: none}
    port:*: {source: interface.oper_status}
  renders:
    front: assets/Cisco/C9300L-24P-4G.front.webp
    rear: assets/Cisco/C9300L-24P-4G.rear.webp
    iso: assets/Cisco/C9300L-24P-4G.iso.webp
    model_sha256: f30376847866eb241e8a73145e3750eac91d2334efaffa2e7dce1c55a512c5a2
    modules: {PS-A: PWR-C1-350WAC-P, PS-B: PWR-C1-350WAC-P, FAN 1: FAN-T2, FAN 2: FAN-T2, FAN 3: FAN-T2}

# rack mounting (spec 1.11 section 8) from Cisco's install guide; mid = Cisco's mid-mount figure (bracket turned round on the front holes), ~98 mm from our bracket model; Cisco's rear mount turns the switch round (see REPORT)
rack_mount:
  ears: true
  positions: {front: 0, mid: 98}
  default: front
  rails: none
