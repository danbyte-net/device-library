model3d:
  file: assets/Cisco/C9300-24P.glb
  far: assets/Cisco/C9300-24P.far.glb
  empty: filler
  leds:
    SYS: {source: device.status}
    BEACON: {source: device.locate}
    STACK: {source: none}
    port:*: {source: interface.oper_status}
  renders:
    front: assets/Cisco/C9300-24P.front.webp
    rear: assets/Cisco/C9300-24P.rear.webp
    iso: assets/Cisco/C9300-24P.iso.webp
    model_sha256: 11c14eb4eb419da000344571ca85e6246dd9cceecd9ea9378d4e5a56c39359d0
    modules:
      Network Module: C9300-NM-8X
      PS-A: PWR-C1-350WAC-P
      PS-B: PWR-C1-350WAC-P
      FAN 1: FAN-T2
      FAN 2: FAN-T2
      FAN 3: FAN-T2

# rack mounting (spec 1.11 section 8) from Cisco's install guide; mid = Cisco's mid-mount figure (bracket turned round on the front holes), ~98 mm from our bracket model; Cisco's rear mount turns the switch round (see REPORT)
rack_mount:
  ears: true
  positions: {front: 0, mid: 98, reversed: 0}
  default: front
  rails: none
