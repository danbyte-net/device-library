      - PWR-C1-350WAC-P
      - PWR-C1-715WAC-P
      - PWR-C1-1100WAC-P
      - PWR-C1-1900WAC-P
      - PWR-C1-1900WHV-T
      - PWR-C1-715WDC
      - PWR-C1-350WAC
      - PWR-C1-715WAC
      - PWR-C1-1100WAC
  PS-B:
    modules:
      - PWR-C1-350WAC-P
      - PWR-C1-715WAC-P
      - PWR-C1-1100WAC-P
      - PWR-C1-1900WAC-P
      - PWR-C1-1900WHV-T
