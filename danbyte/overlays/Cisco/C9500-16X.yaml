  lifecycle:
    end_of_sale: '2026-04-30'
    end_of_security_updates: '2031-04-30'
    end_of_support: '2031-04-30'
    source: https://www.cisco.com/c/en/us/products/collateral/switches/catalyst-9500-series-switches/c9500-16x-switch-nm-c9500-nm-8x-nm-2q-eol.html
  links:
