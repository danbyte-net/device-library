      url: https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst9500/hardware/install/b_catalyst_9500_hig.html
    - kind: eol-notice
      title: End-of-Sale and End-of-Life Announcement for the Cisco C9500-16X Switch and Network Modules C9500-NM-8X and C9500-NM-2Q
