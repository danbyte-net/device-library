# yaml-language-server: $schema=../../schema/overlay.schema.json
format: danbyte-library/v1
upstream: device-types/Cisco/C9200L-24P-4X.yaml
meta:
  category: switch
  roles: [access, poe, campus]
  family: Catalyst 9200L
  summary: 24-port Gigabit PoE+ access switch with four fixed 10G SFP+ uplinks.
  links:
    - kind: datasheet
      title: Cisco Catalyst 9200 Series Switches Data Sheet
      url: https://www.cisco.com/c/en/us/products/collateral/switches/catalyst-9200-series-switches/nb-06-cat9200-ser-data-sheet-cte-en.html
    - kind: install-guide
      title: Cisco Catalyst 9200 Series Switches Hardware Installation Guide
      url: https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst9200/hardware/install/b-c9200-hig.html
    - kind: product-page
      title: Catalyst 9200 Switches Overview
      url: https://www.cisco.com/c/en/us/products/switches/catalyst-9200-series-switches/index.html

module-bays:
  remove:
    - name: FAN 1
      why: the C9200L's fans are fixed, not field-replaceable units (Cisco C9200L hardware installation guide; pack report v1.6.29); upstream lists two fan bays
    - name: FAN 2
      why: the C9200L's fans are fixed, not field-replaceable units (Cisco C9200L hardware installation guide; pack report v1.6.29); upstream lists two fan bays
  PS-1:
    modules: [PWR-C5-600WAC, PWR-C5-715WDC]
  PS-2:
    modules: [PWR-C5-600WAC, PWR-C5-715WDC]

interfaces:
  StackPort1/1:
    type: cisco-stackwise-80
    why: typed by stack system so Danbyte picks the right stack cable head (export spec v1.12 section 8); upstream has the generic cisco-stackwise
  StackPort1/2:
    type: cisco-stackwise-80
    why: typed by stack system so Danbyte picks the right stack cable head (export spec v1.12 section 8); upstream has the generic cisco-stackwise

model3d:
  file: assets/Cisco/C9200L-24P-4X.glb
  far: assets/Cisco/C9200L-24P-4X.far.glb
  empty: filler
  leds:
    SYS: {source: device.status}
    BEACON: {source: device.locate}
    STACK: {source: none}
    port:*: {source: interface.oper_status}
  renders:
    front: assets/Cisco/C9200L-24P-4X.front.webp
    rear: assets/Cisco/C9200L-24P-4X.rear.webp
    iso: assets/Cisco/C9200L-24P-4X.iso.webp
    model_sha256: 479bfdf3440bbfab19ff96938fe2ca45ba6acfaeaea07f88e40a99938ab87cd4
    modules: {PS-1: PWR-C5-600WAC, PS-2: PWR-C5-600WAC}

# rack mounting (spec 1.11 section 8) from Cisco's install guide; mid = Cisco's 'rear-mount' figure (bracket turned round on the front holes), ~98 mm from our bracket model
rack_mount:
  ears: true
  positions: {front: 0, mid: 98}
  default: front
  rails: none
