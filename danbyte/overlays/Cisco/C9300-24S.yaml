# yaml-language-server: $schema=../../schema/overlay.schema.json
format: danbyte-library/v1
upstream: device-types/Cisco/C9300-24S.yaml
meta:
  category: switch
  roles: [access, aggregation, fiber, campus, stacking]
  family: Catalyst 9300
  summary: 24-port 1G SFP switch with a modular uplink slot, StackWise-480 and StackPower.
  links:
    - kind: product-page
      title: Cisco Catalyst 9300 Series Switches
      url: https://www.cisco.com/c/en/us/products/switches/catalyst-9300-series-switches/index.html
    - kind: datasheet
      title: Cisco Catalyst 9300 Series Switches Data Sheet
      url: https://www.cisco.com/c/en/us/products/collateral/switches/catalyst-9300-series-switches/nb-06-cat9300-ser-data-sheet-cte-en.html
    - kind: install-guide
      title: Cisco Catalyst 9300 Series Switches Hardware Installation Guide
      url: https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst9300/hardware/install/b_c9300_hig.html
    - kind: support
      title: Cisco Catalyst 9300 Series Switches - Support
      url: https://www.cisco.com/c/en/us/support/switches/catalyst-9300-series-switches/series.html
    - kind: eol-listing
      title: Cisco Catalyst 9300 Series Switches - End-of-Life and End-of-Sale Notices
      url: https://www.cisco.com/c/en/us/products/switches/catalyst-9300-series-switches/eos-eol-notice-listing.html

power-ports:
  add:
    - name: StackPower1/A
      type: cisco-stackpower
      why: StackPower receptacles on the rear panel, A top and B bottom (Cisco C9300 HIG; pack report v1.6.15); NetBox has no StackPower port type, so Danbyte adds them as cisco-stackpower power ports
    - name: StackPower1/B
      type: cisco-stackpower
      why: StackPower receptacles on the rear panel, A top and B bottom (Cisco C9300 HIG; pack report v1.6.15); NetBox has no StackPower port type, so Danbyte adds them as cisco-stackpower power ports

interfaces:
  StackPort1/1:
    type: cisco-stackwise-480
    why: typed by stack system so Danbyte picks the right stack cable head (export spec v1.12 section 8); upstream has the generic cisco-stackwise
  StackPort1/2:
    type: cisco-stackwise-480
    why: typed by stack system so Danbyte picks the right stack cable head (export spec v1.12 section 8); upstream has the generic cisco-stackwise
  add:
    - name: GigabitEthernet0/0
      type: 1000base-t
      mgmt_only: true
      why: interface added (rear RJ45 management port, as in the Danbyte C9300-24P YAML)

module-bays:
  Network Module:
    modules: [C9300-NM-4G, C9300-NM-4M, C9300-NM-8X, C9300-NM-2Q, C9300-NM-2Y]
  PS-A:
    modules: [PWR-C1-715WAC-P, PWR-C1-350WAC-P, PWR-C1-1100WAC-P]
  PS-B:
    modules: [PWR-C1-715WAC-P, PWR-C1-350WAC-P, PWR-C1-1100WAC-P]
  FAN 1:
    modules: [FAN-T2]
  FAN 2:
    modules: [FAN-T2]
  FAN 3:
    modules: [FAN-T2]

model3d:
  file: assets/Cisco/C9300-24S.glb
  far: assets/Cisco/C9300-24S.far.glb
  empty: filler
  leds:
    SYS: {source: device.status}
    BEACON: {source: device.locate}
    STACK: {source: none}
    port:*: {source: interface.oper_status}
  renders:
    front: assets/Cisco/C9300-24S.front.webp
    rear: assets/Cisco/C9300-24S.rear.webp
    iso: assets/Cisco/C9300-24S.iso.webp
    model_sha256: 4d885d64385db652b61e102eb7992d126f6c0684c71a6590e0c52555ab1679c0
    modules:
      Network Module: C9300-NM-8X
      PS-A: PWR-C1-715WAC-P
      PS-B: PWR-C1-715WAC-P
      FAN 1: FAN-T2
      FAN 2: FAN-T2
      FAN 3: FAN-T2

# rack mounting (spec 1.11 section 8) from Cisco's install guide; mid = Cisco's mid-mount figure (bracket turned round on the front holes), ~98 mm from our bracket model; Cisco's rear mount turns the switch round (see REPORT)
rack_mount:
  ears: true
  positions: {front: 0, mid: 98, reversed: 0}
  default: front
  rails: none
