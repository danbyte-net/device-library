# yaml-language-server: $schema=../../schema/overlay.schema.json
format: danbyte-library/v1
upstream: device-types/Cisco/C9200L-48P-4X.yaml
meta:
  category: switch
  roles: [access, poe, campus]
  family: Catalyst 9200L
  summary: 48-port Gigabit PoE+ access switch with four fixed 10G SFP+ uplinks.
  links:
    - kind: datasheet
      title: Cisco Catalyst 9200 Series Switches Data Sheet
      url: https://www.cisco.com/c/en/us/products/collateral/switches/catalyst-9200-series-switches/nb-06-cat9200-ser-data-sheet-cte-en.html
    - kind: install-guide
      title: Cisco Catalyst 9200 Series Switches Hardware Installation Guide
      url: https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst9200/hardware/install/b-c9200-hig.html
    - kind: product-page
      title: Catalyst 9200 Switches Overview
      url: https://www.cisco.com/c/en/us/products/switches/catalyst-9200-series-switches/index.html

module-bays:
  PS0:
    modules: [PWR-C5-1KWAC, PWR-C5-715WDC]
  PS1:
    modules: [PWR-C5-1KWAC, PWR-C5-715WDC]
  add:
    - name: StackPort1/1
      position: 1/1
      modules: [C9200L-STACK-KIT]
      why: 'stack-kit bay (REVIEW-17; Cisco: one stack adapter per stack port)'
      before: PS0
    - name: StackPort1/2
      position: 1/2
      modules: [C9200L-STACK-KIT]
      why: 'stack-kit bay (REVIEW-17; Cisco: one stack adapter per stack port)'
      after: StackPort1/1

interfaces:
  remove:
    - name: StackPort1/1
      why: 'StackPort1/1 and StackPort1/2 moved to stack-kit module bays (REVIEW-17: the stack ports belong to'
    - name: StackPort1/2
      why: 'StackPort1/1 and StackPort1/2 moved to stack-kit module bays (REVIEW-17: the stack ports belong to'

model3d:
  file: assets/Cisco/C9200L-48P-4X.glb
  far: assets/Cisco/C9200L-48P-4X.far.glb
  empty: filler
  leds:
    SYS: {source: device.status}
    BEACON: {source: device.locate}
    STACK: {source: none}
    port:*: {source: interface.oper_status}
  renders:
    front: assets/Cisco/C9200L-48P-4X.front.webp
    rear: assets/Cisco/C9200L-48P-4X.rear.webp
    iso: assets/Cisco/C9200L-48P-4X.iso.webp
    model_sha256: af6eef6137be147fdc4c32fac30de7a42f60b6b96a0f825f248bec4876df4a61
    modules: {PS0: PWR-C5-1KWAC, PS1: PWR-C5-1KWAC}

# rack mounting (spec 1.11 section 8) from Cisco's install guide; mid = Cisco's 'rear-mount' figure (bracket turned round on the front holes), ~98 mm from our bracket model
rack_mount:
  ears: true
  positions: {front: 0, mid: 98}
  default: front
  rails: none
